<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手機 QR Code 專區 | 雲林縣土庫國小 115學年度新生始業式</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .font-title { font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-sky-50 via-amber-50/40 to-emerald-50 text-slate-800 min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- Top Navigation -->
  <header class="max-w-md mx-auto w-full flex items-center justify-between py-2 mb-4">
    <a href="index.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white shadow-sm border border-slate-200 text-xs font-bold text-slate-700 hover:bg-slate-50 transition">
      <i data-lucide="arrow-left" class="w-4 h-4"></i> 回首頁
    </a>
    <span class="text-xs font-bold text-amber-800 bg-amber-100 px-2.5 py-1 rounded-full">
      📱 家長專屬行動手冊
    </span>
  </header>

  <!-- Main QR Card -->
  <main class="max-w-md mx-auto w-full bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-100 text-center relative overflow-hidden">
    
    <!-- Top Ribbon -->
    <div class="mb-4">
      <span class="text-xs font-black uppercase tracking-wider text-amber-600 bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
        點土成菁・樂動國際我最酷
      </span>
      <h1 class="text-2xl sm:text-3xl font-black font-title text-slate-800 mt-2">
        土庫國小 115 學年度<br><span class="text-brand-600 text-xl font-bold">新生始業式行動手冊</span>
      </h1>
    </div>

    <!-- QR Code Image -->
    <div class="my-6 p-4 bg-slate-50 rounded-2xl border-2 border-dashed border-brand-200 inline-block shadow-inner">
      <!-- 產生的動態 QR Code 指向主網站 -->
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://huangfisk.github.io/TUKU-115/index.html" 
           alt="土庫國小115學年度新生始業式網頁 QR Code" 
           class="w-48 h-48 sm:w-52 sm:h-52 rounded-xl mx-auto shadow-sm">
      <p class="text-[11px] font-bold text-slate-500 mt-2">請使用手機相機或 LINE 掃描開啟</p>
    </div>

    <!-- 學校願景與學生圖像標籤 -->
    <div class="space-y-3 text-left pt-2 border-t border-slate-100">
      <div>
        <div class="text-xs font-bold text-slate-400 mb-1">學校四大願景</div>
        <div class="flex flex-wrap gap-1 text-xs">
          <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-800 font-bold">💡 創思</span>
          <span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">🏃 健美</span>
          <span class="px-2 py-0.5 rounded bg-rose-100 text-rose-800 font-bold">🙏 感恩</span>
          <span class="px-2 py-0.5 rounded bg-sky-100 text-sky-800 font-bold">😊 快樂</span>
        </div>
      </div>

      <div>
        <div class="text-xs font-bold text-slate-400 mb-1">核心學生圖像</div>
        <div class="grid grid-cols-2 gap-1.5 text-xs font-bold">
          <div class="p-1.5 rounded-lg bg-rose-50 text-rose-700 border border-rose-100 flex items-center gap-1">
            <i data-lucide="heart" class="w-3.5 h-3.5"></i> 品德力 (三好生活)
          </div>
          <div class="p-1.5 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-100 flex items-center gap-1">
            <i data-lucide="book" class="w-3.5 h-3.5"></i> 自學力 (閱讀探究)
          </div>
          <div class="p-1.5 rounded-lg bg-amber-50 text-amber-700 border border-amber-100 flex items-center gap-1">
            <i data-lucide="trophy" class="w-3.5 h-3.5"></i> 行動力 (多元展能)
          </div>
          <div class="p-1.5 rounded-lg bg-sky-50 text-sky-700 border border-sky-100 flex items-center gap-1">
            <i data-lucide="languages" class="w-3.5 h-3.5"></i> 溝通力 (雙語國際)
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Direct Button -->
    <div class="mt-6">
      <a href="https://huangfisk.github.io/TUKU-115/index.html" 
         class="w-full inline-flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-sky-600 text-white font-bold text-sm shadow-md hover:scale-102 transition">
        <i data-lucide="external-link" class="w-4 h-4"></i>
        <span>直接點擊前往主網頁</span>
      </a>
    </div>

  </main>

  <!-- Footer -->
  <footer class="max-w-md mx-auto w-full text-center text-slate-400 text-xs py-4">
    <p>雲林縣土庫鎮土庫國民小學・電話：(05) 6622524</p>
    <p class="mt-0.5">校長：陳明誌 0928-990206</p>
  </footer>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
